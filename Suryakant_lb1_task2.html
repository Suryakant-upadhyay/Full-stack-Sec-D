<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Navigation Menu</title>
</head>
<body>
    <header>
        <h1>Student Navigation Portal</h1>
    </header>

    <nav aria-label="Main Navigation">
        <ul>
            <li>
                <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer">Home</a>
            </li>
            <li>
                <a href="https://developer.mozilla.org/" target="_blank" rel="noopener noreferrer">Learning</a>
                <ul>
                    <li><a href="https://developer.mozilla.org/en-US/docs/Web/HTML" target="_blank" rel="noopener noreferrer">HTML</a></li>
                    <li><a href="https://developer.mozilla.org/en-US/docs/Web/CSS" target="_blank" rel="noopener noreferrer">CSS</a></li>
                    <li><a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript" target="_blank" rel="noopener noreferrer">JavaScript</a></li>
                </ul>
            </li>
            <li>
                <a href="https://github.com/" target="_blank" rel="noopener noreferrer">Projects</a>
                <ul>
                    <li><a href="https://github.com/explore" target="_blank" rel="noopener noreferrer">Explore GitHub</a></li>
                    <li><a href="https://github.com/topics/html" target="_blank" rel="noopener noreferrer">HTML Topics</a></li>
                </ul>
            </li>
            <li>
                <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">Contact</a>
            </li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Objective</h2>
            <p>
                This page demonstrates a nested navigation menu using list items
                and anchor elements with absolute external URLs.
            </p>
        </section>
    </main>
</body>
</html>
