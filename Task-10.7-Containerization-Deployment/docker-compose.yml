services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    ports: ["27017:27017"]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/campusconnect
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_this_access_secret
      REFRESH_SECRET: change_this_refresh_secret
      FRONTEND_URL: http://localhost
      NODE_ENV: production
    depends_on: [mongodb,redis]
    ports: ["5000:5000"]
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["80:80"]
volumes:
  mongo_data:
